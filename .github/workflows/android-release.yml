name: Android 多应用构建与发布

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: '构建类型'
        type: choice
        options:
          - debug
          - release
        default: release
        required: true
      nightly:
        description: '发布夜版（独立 Pre-release）'
        type: boolean
        default: false

jobs:
  build-and-release:
    name: 构建并归档 APK
    runs-on: ubuntu-latest

    timeout-minutes: 45
    permissions:
      contents: write

    concurrency:
      group: lyricprovider-${{ github.ref }}-${{ inputs.build-type || 'release' }}
      cancel-in-progress: false

    env:
      BUILD_TYPE: ${{ inputs.build-type || 'release' }}
      GRADLE_TASK: ${{ (inputs.build-type || 'release') == 'release' && 'assembleRelease' || 'assembleDebug' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 配置 JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          cache-disabled: false
          cache-cleanup: on-success

      - name: 解码并校验证书
        #if: ${{ env.BUILD_TYPE == 'release' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?缺少 GitHub Secret：SIGNING_KEY}"
          : "${KEY_STORE_PASSWORD:?缺少 GitHub Secret：KEY_STORE_PASSWORD}"
          : "${KEY_ALIAS:?缺少 GitHub Secret：ALIAS}"
          : "${KEY_PASSWORD:?缺少 GitHub Secret：KEY_PASSWORD}"

          printf '%s' "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          test -s "$GITHUB_WORKSPACE/release.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/release.jks" \
            -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1

      - name: 构建 APK
        run: |
          set -euo pipefail
          if [[ "$BUILD_TYPE" == "release" ]]; then
            test -s "$RELEASE_STORE_FILE"
            [[ -n "$RELEASE_STORE_PASSWORD" ]]
          fi
          ./gradlew "$GRADLE_TASK" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --build-cache --continue --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ env.BUILD_TYPE == 'release' && secrets.KEY_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ env.BUILD_TYPE == 'release' && secrets.ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ env.BUILD_TYPE == 'release' && secrets.KEY_PASSWORD || '' }}

      - name: 收集 APK 到统一目录
        if: ${{ success() }}
        run: |
          set -euo pipefail
          mkdir -p collected-apks

          mapfile -d '' APK_FILES < <(
            find . -type f -name "*.apk" \
              -path "*/build/outputs/apk/${BUILD_TYPE}/*" -print0
          )

          if (( ${#APK_FILES[@]} == 0 )); then
            echo "::error::未生成任何 ${BUILD_TYPE} APK。"
            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            destination="collected-apks/$(basename "$apk")"
            if [[ -e "$destination" ]]; then
              echo "::error::APK 目标文件名重复：$destination"
              exit 1
            fi
            cp -- "$apk" "$destination"
          done

          (
            cd collected-apks
            sha256sum *.apk > SHA256SUMS
          )

          echo "收集到的文件："
          ls -lh collected-apks/

      - name: 上传 APK 制品
        if: ${{ success() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.BUILD_TYPE }}-apks
          path: collected-apks/
          if-no-files-found: error
          archive: true
          compression-level: 6
          retention-days: 90

      - name: 生成夜版标记
        if: ${{ inputs.nightly }}
        id: stamp
        run: |
          set -euo pipefail
          echo "tag=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "label=$(date -u +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: 发布夜版
        if: ${{ inputs.nightly }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.stamp.outputs.tag }}
          name: Nightly ${{ steps.stamp.outputs.label }}
          body: |
            commit: ${{ github.sha }}
            type: ${{ env.BUILD_TYPE }}
          prerelease: true
          files: collected-apks/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理
        if: always()
        run: |
          rm -f release.jks || true
          rm -rf collected-apks || true
